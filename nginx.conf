worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    upstream backend {
        # سرورهای backend با تنظیمات failover بهتر
        server app1:80 max_fails=2 fail_timeout=10s;
        server app2:80 max_fails=2 fail_timeout=10s;
        server app3:80 max_fails=2 fail_timeout=10s;

        # فعال کردن health check داخلی nginx (نیاز به nginx plus یا ماژول 3rd party)
        # اگر در نسخه open-source هستی، می‌تونی healthcheck دستی با location /health تو اپ بذاری و در اسکریپت جداگانه نظارت کنی

        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # افزایش timeouts برای جلوگیری از قطع ناگهانی
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Retry خودکار روی سرورهای بعدی اگر سرور پاسخ نداد
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # تعداد دفعات ریتری
            proxy_next_upstream_tries 3;

            # بافرها برای افزایش کارایی
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 16k;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
