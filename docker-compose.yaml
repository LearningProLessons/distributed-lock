version: "3.9"

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app1
    depends_on:
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:80
    expose:
      - "80"

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app2
    depends_on:
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:80
    expose:
      - "80"

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app3
    depends_on:
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:80
    expose:
      - "80"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
      - app3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
